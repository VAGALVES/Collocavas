<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D131B">
<meta name="description" content="Colocações em inglês — VS Linguistic Lab">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap"></noscript>
<title>Colocações · VS Linguistic Lab</title>
<script>
/* guarda de inicialização — roda antes de tudo */
(function(){
  window.__boot=false; window.__bootErr=[];
  function limpar(){
    var p=[];
    try{ if(navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));})); }catch(e){}
    try{ if(window.caches) p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));})); }catch(e){}
    Promise.all(p).then(function(){ location.reload(); },function(){ location.reload(); });
  }
  function mostrar(msg){
    if(window.__boot||document.getElementById('bootfail')) return;
    var d=document.createElement('div'); d.id='bootfail';
    d.style.cssText='position:fixed;inset:0;z-index:9999;background:#0D131B;color:#E8EDF4;font:16px/1.5 system-ui,sans-serif;padding:24px;overflow:auto';
    d.innerHTML='<h2 style="font:700 22px Georgia,serif;margin:0 0 8px">O app não iniciou</h2><p style="color:#9AA7BA;margin:0 0 14px">Seu progresso está salvo no aparelho. Toque em “Limpar cache e recarregar”. Se continuar, envie ao desenvolvedor o texto abaixo.</p>'
     +'<button id="bfix" style="min-height:48px;padding:0 20px;border-radius:12px;border:0;background:#E8EDF4;color:#0D131B;font:600 16px system-ui;margin-bottom:16px">Limpar cache e recarregar</button>'
     +'<pre style="white-space:pre-wrap;background:#141C27;border:1px solid #273241;border-radius:12px;padding:12px;font:12px/1.4 monospace;color:#9AA7BA">'+String(msg).replace(/</g,'&lt;')+'\n\n'+navigator.userAgent+'</pre>';
    document.body.appendChild(d); document.getElementById('bfix').onclick=limpar;
  }
  window.addEventListener('error',function(e){ window.__bootErr.push(e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+')'); if(!window.__boot) setTimeout(function(){ mostrar(window.__bootErr.join('\n')); },50); });
  window.addEventListener('unhandledrejection',function(e){ window.__bootErr.push('promessa: '+(e.reason&&e.reason.message||e.reason)); });
  setTimeout(function(){ if(!window.__boot) mostrar('Tempo esgotado (8 s) sem iniciar.\n'+(window.__bootErr.join('\n')||'sem erro de script')); },8000);
})();
</script>
<style>
/* ================= TOKENS =================
   Família visual dos Painéis Mestres (navy / latão / teal). Cor segue a FUNÇÃO gramatical:
   verbo=laranja · substantivo=azul · adjetivo=violeta · intensificador=lima · preposição=teal · artigo=cinza.
   Status: cor + ícone + texto. */
:root{
  --bg:#0D131B; --panel:#141C27; --panel2:#1A2431; --line:#273241; --ink:#E8EDF4; --mute:#9AA7BA;
  --brass:#D6AB55; --brassd:#3A3020;
  --verb:#F29A47; --noun:#6CA6FF; --adj:#AB93FF; --adv:#93D656; --prep:#4FD1C5; --det:#93A0B5;
  --ok:#45D2A3; --warn:#E8B64F; --bad:#FF8070; --na:#93A0B5;
  --hdr:54px; --nav:64px; --r:16px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans","Segoe UI",Roboto,system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#F2EEE4; --panel:#FFFDF8; --panel2:#F6F1E6; --line:#DDD5C4; --ink:#1B2430; --mute:#5C677A;
  --brass:#8F6A12; --brassd:#EFE4C8;
  --verb:#C25E00; --noun:#1D5CCB; --adj:#6A3CCF; --adv:#4A8300; --prep:#0B7F78; --det:#667286;
  --ok:#0B7A55; --warn:#8C5A00; --bad:#B5301D; --na:#5C677A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 20px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--mute)}

/* ---------- cabeçalho ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{height:var(--hdr);display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--serif);letter-spacing:-.01em;flex:1}
.mark{position:relative;width:26px;height:22px}
.mark i{position:absolute;height:8px;border-radius:2px}
.mark i:nth-child(1){left:0;bottom:0;width:26px;background:var(--noun)}
.mark i:nth-child(2){left:-2px;bottom:10px;width:18px;background:var(--verb)}
.mark i:nth-child(3){left:10px;bottom:10px;width:14px;background:var(--adj)}
.ib{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;min-width:42px;height:42px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}

/* ---------- títulos de tela ---------- */
.screen{padding-top:20px}
.screen h1{font:700 30px/1.12 var(--serif);letter-spacing:-.015em}
.screen .lead{color:var(--mute);margin-top:6px;font-size:15.5px}
.sec{margin-top:28px}
.sec>h2{font:700 21px/1.2 var(--serif);margin-bottom:12px;letter-spacing:-.01em}
.sec>.sub{color:var(--mute);font-size:14.5px;margin:-6px 0 12px}

/* ---------- controles ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;min-height:40px;line-height:1.2;white-space:nowrap}
.chip small{color:var(--mute);margin-left:6px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--panel);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 6px;min-height:44px;font-size:14.5px;line-height:1.2;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.field{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;min-height:50px;font-size:16px}
.field::placeholder{color:var(--mute)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:14px;min-height:50px;padding:8px 20px;line-height:1.3;font-weight:600;font-size:16px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--brass);text-decoration:underline;text-underline-offset:3px;padding:8px 0;font-weight:500}

/* barra fixa de busca + nível */
.sbar{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top));z-index:30;background:var(--bg);padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.sbar .field{margin-bottom:10px}

/* ---------- tags e status ---------- */
.tag{display:inline-block;font-size:12px;line-height:1.5;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--mute);white-space:nowrap}
.tag.lv{border-color:var(--brass);color:var(--brass);font-weight:600}
.g{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--sc);color:var(--bg)}
[data-s="3"]{--sc:var(--ok)} [data-s="2"]{--sc:var(--warn)} [data-s="0"]{--sc:var(--bad)} [data-s="n"]{--sc:var(--na)}

/* ---------- INÍCIO ---------- */
.today{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:20px}
.today h2{font:700 22px/1.2 var(--serif)}
.today .nums{display:flex;gap:22px;margin:14px 0 18px}
.today .nums b{display:block;font:700 34px/1 var(--serif)}
.today .nums span{font-size:13.5px;color:var(--mute)}
.lvrow{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:10px}
.lvrow .top2{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lvrow .nm{font:700 20px/1.2 var(--serif)}
.lvrow .ds{font-size:14px;color:var(--mute);margin-top:2px}
.lvrow .ct{font-size:13.5px;color:var(--mute);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:12px;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)} .bar .s{background:var(--brass)}
.lvrow .legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin-top:8px}
.lvrow .acts{display:flex;gap:8px;margin-top:12px}
.lvrow .acts .btn{min-height:42px;font-size:14.5px;padding:0 14px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px}
.tile .ic{font-size:24px}
.tile b{display:block;font-weight:600}
.tile span{font-size:14px;color:var(--mute)}

/* ---------- GLOSSÁRIO ---------- */
.gwrap{display:flex;gap:4px;align-items:flex-start;margin-top:10px}
.gmain{flex:1;min-width:0}
.arail{position:sticky;top:calc(var(--hdr) + 140px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;width:26px;flex:none;padding-top:6px}
.arail button{border:0;background:none;width:26px;height:21px;font-size:11.5px;font-weight:600;color:var(--mute);padding:0}
.arail button:active{color:var(--brass)}
.let{font:700 22px/1 var(--serif);color:var(--brass);margin:22px 0 8px;scroll-margin-top:calc(var(--hdr) + 156px)}
.let:first-child{margin-top:8px}
.head{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.hbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 14px;min-height:60px}
.hw{font:700 20px/1.2 var(--serif)}
.hpt{display:block;font-size:14px;color:var(--mute)}
.hmeta{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.hmeta .n{font-size:13px;color:var(--mute);white-space:nowrap}
.hmeta .n b{color:var(--ink);font-weight:600}
.hmeta .n em{font-style:normal;color:var(--bad);margin-left:6px}
.hmeta .chev{color:var(--mute);transition:transform .2s;font-size:14px}
.hbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.hbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.hbody h4{font-size:13.5px;font-weight:600;color:var(--mute);margin:16px 0 6px;display:flex;gap:8px;align-items:center}
.hbody h4::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--hc)}
.prow{display:flex;align-items:center;gap:10px;border-radius:12px}
.prow.dim{opacity:.4}
.prow .main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:9px 0;min-height:48px}
.pph{font:700 17px/1.25 var(--serif)}
.prow[data-s="0"] .pph{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--mute)}
.pgl{display:block;font-size:14px;color:var(--mute);line-height:1.35}
.prow .sp{flex:none;border:0;background:none;width:40px;height:40px;border-radius:50%;font-size:16px}
.prow+.prow{border-top:1px solid var(--line)}
.prow{border-radius:0}
.snote{font-size:14px;color:var(--mute);background:var(--panel2);border-left:3px solid var(--brass);border-radius:0 10px 10px 0;padding:8px 12px;margin:6px 0 4px}
.hfoot{display:flex;gap:8px;margin-top:14px}
.hfoot .btn{flex:1;min-height:46px;font-size:15px;padding:0 10px}
.empty{padding:32px 10px;text-align:center;color:var(--mute)}

/* ---------- LABORATÓRIO ---------- */
.pickbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;min-height:62px}
.pickbtn .hw{font-size:22px}
.pickbtn .chev{margin-left:auto;color:var(--mute)}
.readout{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top));z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 12px 10px;margin-top:12px;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.bricks{display:flex;flex-wrap:wrap;gap:14px 8px;align-items:flex-end}
.brick{--c:var(--det);position:relative;text-align:left;background:color-mix(in srgb,var(--c) 15%,var(--panel));border:2px solid var(--c);border-radius:11px;padding:3px 10px 5px;min-width:52px}
.brick::before{content:"";position:absolute;top:-8px;left:11px;width:14px;height:7px;background:var(--c);border-radius:4px 4px 0 0;box-shadow:24px 0 0 var(--c)}
.brick:active{transform:translateY(2px)}
.brick .role{display:block;font-size:10.5px;color:var(--mute);line-height:1.2}
.brick .w{display:block;font:700 20px/1.2 var(--serif);letter-spacing:-.01em}
.brick.idm{--c:var(--brass)} .brick.idm .w{font-size:18px;line-height:1.3}
.brick.verb{--c:var(--verb)} .brick.noun{--c:var(--noun)} .brick.adj{--c:var(--adj)} .brick.adv{--c:var(--adv)} .brick.prep{--c:var(--prep)} .brick.det{--c:var(--det)}
.brick.empty{border-style:dashed} .brick.empty .w{color:var(--mute)}
.rline{display:flex;align-items:center;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--sc);color:var(--sc);border-radius:999px;padding:3px 10px 3px 3px;font-weight:600;font-size:13px;white-space:nowrap}
.pill i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sc);color:var(--bg);font-size:13px;font-weight:700}
.gloss{flex:1;min-width:0;font-size:14px;line-height:1.3}
.acts{display:flex;gap:6px}
.acts .ib{min-width:40px;height:40px;padding:0}
.hint{color:var(--mute);font-size:14px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;overflow:hidden}
.lgroup{margin-top:14px}
.lgroup>h3{font-size:13.5px;font-weight:600;color:var(--mute);margin:0 0 6px 2px;display:flex;gap:8px;align-items:center}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 0;min-height:56px;border-radius:10px}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow{border-radius:0}
.lrow .t{flex:1;min-width:0}
.lrow[aria-pressed="true"]{background:color-mix(in srgb,var(--sc) 14%,transparent);box-shadow:inset 3px 0 0 var(--sc);margin:0 -14px;width:calc(100% + 28px);padding:10px 14px 10px 17px}
.lrow .w{font:700 18px/1.2 var(--serif)}
.lrow[data-s="0"] .w{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--mute)}
.lrow .gl{display:block;font-size:13.5px;color:var(--mute);line-height:1.3}
.inline{display:flex;gap:8px;margin-top:14px}
.inline .field{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card .vh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card .vh strong{color:var(--sc);font:700 20px var(--serif)}
.card .ph{font:700 21px/1.3 var(--serif)}
.card p+p{margin-top:8px}
.callout{margin-top:12px;border-left:3px solid var(--brass);background:var(--panel2);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15px}
.callout b{color:var(--brass)}
.exbox{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;background:var(--panel2);border-radius:12px;padding:12px 14px}
.exbox p{margin:0!important;font:500 18px/1.4 var(--serif)}
mark{background:color-mix(in srgb,var(--ok) 28%,transparent);color:inherit;border-radius:4px;padding:0 3px}
details.refine{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0 16px}
details.refine summary{padding:14px 0;min-height:52px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.refine summary::after{content:"＋";color:var(--mute)}
details.refine[open] summary::after{content:"−"}
details.refine .chips{padding-bottom:16px}

/* ---------- áudio ---------- */
.hrow{display:flex;align-items:center}
.hrow .hbtn{flex:1;min-width:0}
.sp{flex:none;border:0;background:none;width:40px;height:40px;border-radius:50%;font-size:16px}
.hrow .sp{margin-right:6px}
.lwrap{display:flex;align-items:center;border-radius:0}
.lwrap+.lwrap{border-top:1px solid var(--line)}
.lwrap .lrow{flex:1;min-width:0;border-top:0!important;margin:0!important;width:auto!important;box-shadow:none!important;background:none!important;padding:10px 0}
.lwrap.sel{background:color-mix(in srgb,var(--sc) 14%,transparent);box-shadow:inset 3px 0 0 var(--sc);margin:0 -14px;padding:0 8px 0 17px}
.fbrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fbrow .ib{height:40px;font-size:14px}
.miss .sp{vertical-align:middle}

/* ---------- mapa privado dos livros ---------- */
.bookref{margin-top:12px;background:var(--panel);border:1px solid var(--brass);border-radius:var(--r);padding:12px 14px;font-size:14.5px}
.bookref>b{color:var(--brass)}
.bkrow{margin-top:8px;line-height:1.4}
.bookline{margin-top:12px;font-size:13.5px;color:var(--mute);border-top:1px dashed var(--line);padding-top:10px}

/* ---------- trilha / unidades / progresso ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tilec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tilec .ic{display:block;font-size:20px;margin-bottom:8px}
.tilec b{display:block;font:700 26px/1.1 var(--serif)}
.tilec span:last-child{font-size:12.5px;color:var(--mute)}
.journey{background:#101826;color:#E8EDF4;border-radius:20px;padding:20px;margin-top:14px;border:1px solid #273241}
.journey .jk{font-size:12px;letter-spacing:.1em;color:#9AA7BA}
.journey .jv{font:700 28px/1.15 var(--serif);margin-top:8px}
.journey .jd{color:#9AA7BA;font-size:14px;margin-top:4px}
.jbar{height:8px;background:#273241;border-radius:99px;overflow:hidden;margin-top:14px}
.jbar i{display:block;height:100%;background:#D6AB55}
.shead{display:flex;align-items:baseline;justify-content:space-between}
.shead h2{margin:0!important}
.unit{display:flex;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px;align-items:flex-start}
.unit.done{border-color:var(--ok)}
.unit.rev,.unit.test{border-style:dashed;background:transparent}
.unit .un{font:700 24px/1.1 var(--serif);color:var(--mute);min-width:34px}
.unit .ub{flex:1;min-width:0}
.unit .ut{display:block;font:700 18px/1.3 var(--serif)}
.unit .us{display:block;font-size:13.5px;color:var(--mute);margin-top:2px}
.unit .us[lang=en]{color:var(--ink);opacity:.8;font-style:italic}
.unit .tag{font:500 10.5px var(--sans);letter-spacing:.04em;vertical-align:2px;margin-left:4px}
.mini{display:block;height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px}
.mini i{display:block;height:100%;background:var(--ok)}
.lvh{font:700 22px/1.2 var(--serif);margin:28px 0 0}
.lvh span{font:400 14px var(--sans);color:var(--mute);margin-left:8px}
.utabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.utabs button{flex:none;border:0;background:transparent;border-radius:10px;padding:9px 14px;min-height:44px;font-size:14.5px;font-weight:500;white-space:nowrap}
.utabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px}
.bars i{flex:1;background:var(--brass);border-radius:4px 4px 0 0;min-height:3px}
.bl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.urow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.urow:first-child{border-top:0}
.optrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}
.optrow .opt{margin-top:0;text-align:center}
.blank{border-bottom:2.5px solid var(--brass);padding:0 6px;color:var(--brass);min-width:70px;display:inline-block;text-align:center}
.blank.on{color:var(--ok);border-color:var(--ok)}

/* ---------- temas / refinar ---------- */
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:72px}
.theme b{display:block;font:700 16px/1.25 var(--serif)}
.theme span{font-size:13px;color:var(--mute)}
.moreb{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:10px 0 4px;color:var(--ink);font-weight:600;min-height:44px}
.moreb .bd{background:var(--brass);color:var(--bg);border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;margin-left:8px;padding:0 6px}
.moreb .chev{color:var(--mute);transition:transform .2s}
.moreb[aria-expanded="true"] .chev{transform:rotate(90deg)}
.morep{padding-bottom:6px}
.morep h3{font-size:13px;color:var(--mute);font-weight:600;margin:10px 0 6px}

/* ---------- PRATICAR ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font:700 26px/1.1 var(--serif)}
.stat span{font-size:12.5px;color:var(--mute)}
.qhead{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:8px}
.qprog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:22px}
.qprog i{display:block;height:100%;background:var(--brass);transition:width .25s}
.qprompt{font:500 24px/1.3 var(--serif);margin-bottom:6px}
.qprompt b{color:var(--brass)}
.qhelp{font-size:14px;color:var(--mute);margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;min-height:58px;margin-top:10px;font:700 20px/1.2 var(--serif)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.miss{border-top:1px solid var(--line);padding:10px 0}
.miss:first-child{border-top:0}

.scrim{position:fixed;inset:0;background:rgba(5,9,14,.6);z-index:70}
.sheet{position:fixed;inset:auto 0 0 0;z-index:71;max-width:720px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;
  height:min(88vh,100% - 20px);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet header h2{font:700 21px var(--serif);flex:1}
.sheet .body{overflow:auto;padding:0 16px 24px;flex:1}
.sheet .pre{padding:0 16px 10px}
.pl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;min-height:58px}

.pl .tag{margin-left:auto}

.lg{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--c);border-radius:10px;padding:4px 12px;font-size:14px;background:color-mix(in srgb,var(--c) 14%,var(--panel));margin:0 8px 8px 0}
.pat{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.pat b{font-family:var(--serif)}

/* ---------- navegação inferior ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);font-size:11.5px;font-weight:500;position:relative}
.tabs button span{font-size:21px;line-height:1}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
footer{color:var(--mute);font-size:13px;margin:30px 0 0;text-align:center}

titulo":"O prazo de sexta","linhas":[["A","Will the team meet the deadline on Friday?"],["B","It will be tight. We are waiting for data from the supplier."],["A","If necessary, we can push back the launch by a week."],["B","I'd rather not. Let me talk to them today and see if they can speed things up."]],"q":{"t":"What does Speaker B prefer?","o":["To keep the launch date","To push back the launch","To change suppliers","To cancel the project"]},"usa":["meet the deadline","push back"]},{"id":"E13","c":"B2","ctx":"Pessoas e RH","tipo":"announcement","titulo":"Nova política de trabalho remoto","linhas":[["N","Good morning. From next month, employees will be able to work from home on Wednesdays and Fridays. Managers will approve requests in advance. We believe this change will improve flexibility without affecting results."]],"q":{"t":"What is the new policy?","o":["Working from home two days a week","Longer hours on Fridays","A shorter lunch break","Unpaid leave in August"]},"usa":["work from home","in advance"]},{"id":"E14","c":"C1","ctx":"Contratos e negociação","tipo":"dialogue","titulo":"Uma cláusula polêmica","linhas":[["A","Before we sign, I'd like to raise a concern about clause nine."],["B","The one on penalties for late delivery?"],["A","Exactly. In its current form, it holds us liable for delays that are outside our control."],["B","We could amend it to cover only delays caused by your side. Would that be acceptable?"]],"q":{"t":"What does Speaker A want to change?","o":["The clause on penalties","The delivery address","The price","The length of the contract"]},"usa":["amend a clause","out of control"]},{"id":"E15","c":"C1","ctx":"Gestão e projetos","tipo":"dialogue","titulo":"O gargalo da expansão","linhas":[["A","The pilot exceeded expectations, but scaling it up will be a challenge."],["B","What is the main bottleneck?"],["A","Approvals. Every change needs three signatures, which slows everything down."],["B","Then let's streamline the process before we roll out the second phase."]],"q":{"t":"What is the main obstacle?","o":["Slow approvals","A lack of staff","A shortage of funds","Poor test results"]},"usa":["exceed expectations","roll out"]},{"id":"E16","c":"C1","ctx":"Finanças e orçamento","tipo":"announcement","titulo":"Resultado do trimestre","linhas":[["N","The company reported a strong quarter, with revenue up eight percent. However, margins narrowed as costs rose, and management has decided to cut spending on travel. The board expects growth to remain steady through the end of the year."]],"q":{"t":"What will the company cut?","o":["Travel spending","Staff","Advertising","Salaries"]},"usa":["cut costs","narrow margins"]}];
const EQUIV=[{"id":"Q01","c":"C1","tema":"estilo","s":"Known for her ______ replies, the diplomat rarely used more than a sentence to answer any question.","ok":["laconic","terse"],"bad":["garrulous","verbose","ebullient","obsequious"],"exp":"Respostas de uma frase são lacônicas ou concisas (terse). Garrulous e verbose formam um par de sinônimos, mas significam o oposto."},{"id":"Q02","c":"C1","tema":"redução","s":"The new subsidy was meant to ______ the effects of the recession, though economists doubted it would do more than ease the worst of the pain.","ok":["mitigate","alleviate"],"bad":["exacerbate","aggravate","foment","deride"],"exp":"\"Ease the worst of the pain\" indica suavizar o efeito. Exacerbate e aggravate formam um par que dá o sentido contrário."},{"id":"Q03","c":"C1","tema":"clichê","s":"Critics found the director's latest film ______; its plot offered nothing a viewer had not seen a hundred times.","ok":["banal","trite"],"bad":["iconoclastic","ebullient","recondite","fractious"],"exp":"Enredo já visto cem vezes é banal ou batido (trite). Nenhuma das outras opções expressa falta de originalidade."},{"id":"Q04","c":"C2","tema":"honestidade","s":"The witness's habit of ______ made it hard for the jury to trust any detail of his account.","ok":["prevarication","equivocation"],"bad":["magnanimity","probity","levity","forbearance"],"exp":"O hábito de enrolar ou falar ambiguamente (prevarication, equivocation) tira a confiança. Magnanimity e probity, ao contrário, a aumentariam."},{"id":"Q05","c":"C2","tema":"obscuridade","s":"The professor's ______ lectures, full of obscure references, were admired by specialists but bewildered most undergraduates.","ok":["esoteric","recondite"],"bad":["lucid","limpid","banal","capricious"],"exp":"Referências obscuras que só especialistas entendem são esotéricas ou recônditas. Lucid e limpid, par de \"claro\", seriam o contrário."},{"id":"Q06","c":"C2","tema":"reserva","s":"Far from being ______ about the merger, the CEO announced it with obvious enthusiasm.","ok":["reticent","diffident"],"bad":["ebullient","garrulous","insipid","recalcitrant"],"exp":"\"Far from being...\" pede o contrário de entusiasmo contido. Reticent e diffident indicam reserva. Ebullient e garrulous seriam coerentes com o entusiasmo, e não com \"far from\"."},{"id":"Q07","c":"C1","tema":"miséria","s":"Years of drought and failed harvests left the village in ______ poverty, with many families unable to buy bread.","ok":["abject","dire"],"bad":["sporadic","gregarious","salubrious","whimsical"],"exp":"Pobreza extrema que impede comprar pão é abject ou dire."},{"id":"Q08","c":"C2","tema":"apaziguar","s":"The mayor's attempt to ______ the angry crowd with a small concession only made them more furious.","ok":["placate","mollify"],"bad":["goad","foment","enervate","plumb"],"exp":"Tentar acalmar com uma concessão: placate ou mollify. Goad e foment (provocar, fomentar) formam um par, mas não combinam com \"concession\"."},{"id":"Q09","c":"C1","tema":"variedade","s":"A scholar of ______ interests, she wrote with equal authority on medieval poetry, marine biology and tax law.","ok":["eclectic","multifarious"],"bad":["insular","parochial","doctrinaire","esoteric"],"exp":"Interesses que vão da poesia ao direito tributário são ecléticos ou multifacetados. Insular e parochial formam um par de sentido contrário."},{"id":"Q10","c":"C2","tema":"falsidade","s":"The argument was ______: it sounded convincing but rested on a false premise.","ok":["specious","fallacious"],"bad":["cogent","lucid","pragmatic","ebullient"],"exp":"Soa convincente mas é falso: specious ou fallacious. Cogent e lucid indicariam um argumento bom."},{"id":"Q11","c":"C2","tema":"exagero","s":"The coach's ______ praise made the players uncomfortable, since everyone knew he was exaggerating.","ok":["fulsome","effusive"],"bad":["perfunctory","grudging","lucid","tenuous"],"exp":"Elogio exagerado é fulsome ou effusive. Perfunctory e grudging (elogio mínimo) formam um par do tipo contrário."},{"id":"Q12","c":"C2","tema":"rejeição","s":"The treaty was ______ by the new government, which declared that it no longer considered itself bound by its terms.","ok":["repudiated","rescinded"],"bad":["ratified","endorsed","substantiated","belied"],"exp":"Declarar-se desobrigado é rejeitar ou revogar. Ratified e endorsed (confirmar) formam um par de sentido oposto."},{"id":"Q13","c":"C2","tema":"calma","s":"Her ______ manner, always calm even in a crisis, made her an ideal emergency doctor.","ok":["imperturbable","phlegmatic"],"bad":["irascible","petulant","capricious","histrionic"],"exp":"Calma em crise: imperturbable ou phlegmatic. Irascible e petulant (que se irritam) formam um par oposto."},{"id":"Q14","c":"C2","tema":"teimosia","s":"The senator's ______ opposition to the bill never softened, even after months of negotiation.","ok":["implacable","intransigent"],"bad":["tractable","amenable","tentative","ephemeral"],"exp":"Oposição que não cede é implacável ou intransigente. Tractable e amenable (flexíveis) seriam o oposto."},{"id":"Q15","c":"C1","tema":"contraste","s":"Although the island's economy is now ______, it once depended almost entirely on a single crop.","ok":["diversified","varied"],"bad":["monolithic","homogeneous","precarious","quiescent"],"exp":"\"Although... once depended on a single crop\" pede o contrário de dependência única: diversificada ou variada. Monolithic e homogeneous formam o par que significa uniforme."},{"id":"Q16","c":"C1","tema":"artificialidade","s":"The critic dismissed the novel's ending as ______, a neat solution that felt forced and unearned.","ok":["contrived","artificial"],"bad":["organic","inevitable","pellucid","ambiguous"],"exp":"Final forçado e sem merecimento é contrived ou artificial. Organic e inevitable (natural) dão o sentido contrário."},{"id":"Q17","c":"C1","tema":"isolamento","s":"The mountain village was so ______ that visitors needed two days to reach it by road.","ok":["remote","secluded"],"bad":["accessible","convenient","populous","luminous"],"exp":"Dois dias de viagem indicam local remoto ou isolado. Accessible e convenient seriam o oposto."},{"id":"Q18","c":"C2","tema":"ganância","s":"Her ______ led her to ignore warnings that the investment was risky.","ok":["avarice","cupidity"],"bad":["prudence","frugality","levity","probity"],"exp":"Ignorar riscos por dinheiro é avareza ou cobiça (cupidity). Prudence e frugality indicariam cautela."},{"id":"Q19","c":"C2","tema":"evasão","s":"The spokesman's carefully ______ statement avoided any direct answer to the reporter's question.","ok":["equivocal","evasive"],"bad":["categorical","explicit","jocose","pedantic"],"exp":"Uma declaração que foge da pergunta é equívoca ou evasiva. Categorical e explicit seriam diretas."},{"id":"Q20","c":"C1","tema":"repreensão","s":"Rather than punish the child severely, the teacher chose to ______ her gently for the mistake.","ok":["admonish","chide"],"bad":["laud","commend","goad","assuage"],"exp":"Repreender com brandura: admonish ou chide. Laud e commend (elogiar) formam um par que não serve."},{"id":"Q21","c":"C2","tema":"queda","s":"The ______ of the old regime was swift: within a week its leaders had fled and its offices stood empty.","ok":["collapse","dissolution"],"bad":["consolidation","entrenchment","ratification","burgeoning"],"exp":"Líderes em fuga e escritórios vazios indicam colapso ou dissolução. Consolidation e entrenchment (fortalecimento) formam o par contrário."},{"id":"Q22","c":"C2","tema":"generosidade","s":"Though the winner had been expected to gloat, she showed surprising ______, thanking her rivals warmly.","ok":["magnanimity","graciousness"],"bad":["truculence","arrogance","apathy","levity"],"exp":"Agradecer aos rivais em vez de se gabar: magnanimidade ou elegância (graciousness). Truculence e arrogance formam um par de sentido contrário."},{"id":"Q23","c":"C1","tema":"prudência","s":"Spending that once seemed ______ now looks reckless, given the size of the deficit.","ok":["prudent","judicious"],"bad":["profligate","spendthrift","tenuous","vapid"],"exp":"\"Once seemed... now looks reckless\" pede o contrário de imprudente: prudent ou judicious. Profligate e spendthrift são sinônimos de gasto imprudente e não contrastam com \"reckless\"."},{"id":"Q24","c":"C2","tema":"estilo","s":"The poet's early work was ______ in style, dense with Latin phrases and elaborate sentences.","ok":["florid","ornate"],"bad":["laconic","spare","pellucid","banal"],"exp":"Frases elaboradas e densas: florid ou ornate. Laconic e spare (sóbrio) formam o par oposto."},{"id":"Q25","c":"C2","tema":"neutralidade","s":"Reluctant to risk offending anyone, the committee issued a ______ report that criticised no one and recommended nothing.","ok":["bland","innocuous"],"bad":["scathing","vitriolic","prescient","lucid"],"exp":"Um relatório que não critica nem recomenda é insosso ou inofensivo. Scathing e vitriolic (duros) formam um par contrário."},{"id":"Q26","c":"C1","tema":"cuidado","s":"Her ______ attention to detail meant that even minor errors in the accounts were caught and corrected.","ok":["meticulous","scrupulous"],"bad":["cursory","perfunctory","desultory","nonchalant"],"exp":"Pegar erros pequenos mostra cuidado: meticulous ou scrupulous. Cursory e perfunctory (superficial) formam o par contrário."},{"id":"Q27","c":"C2","tema":"permanência","s":"The author's later novels reveal an ______ pessimism, a settled conviction that human nature cannot improve.","ok":["abiding","ingrained"],"bad":["fleeting","transient","whimsical","facetious"],"exp":"\"Settled conviction\" indica algo duradouro: abiding ou ingrained. Fleeting e transient (passageiros) formam um par oposto."},{"id":"Q28","c":"C1","tema":"distorção","s":"The senator was accused of ______ the facts to make his opponent's record look worse than it was.","ok":["distorting","misrepresenting"],"bad":["substantiating","verifying","eulogizing","gleaning"],"exp":"Fazer o registro do adversário parecer pior do que é: distorcer ou deturpar. Substantiating e verifying (comprovar) formam um par que daria o sentido contrário."},{"id":"Q29","c":"C1","tema":"divisão","s":"The crowd's response to the singer was ______; some cheered wildly while others walked out in disgust.","ok":["mixed","divided"],"bad":["unanimous","uniform","sedate","tacit"],"exp":"Uns aplaudindo e outros saindo: reação mista ou dividida. Unanimous e uniform seriam o oposto."},{"id":"Q30","c":"C1","tema":"barulho","s":"Having grown up amid constant ______, she was unaccustomed to the calm of the countryside.","ok":["din","clamor"],"bad":["solitude","seclusion","serenity","levity"],"exp":"\"Unaccustomed to the calm\" mostra que ela cresceu no barulho: din ou clamor. Solitude e seclusion são o contrário."}];

function detKey(st,a,it,ov){
  if(st==='vn'){ if(ov!==null&&ov!==undefined) return ov; if(it&&it.d!==undefined) return it.d; return a.det||''; }
  if(st==='pn'){ if(it&&it.d!==undefined) return it.d; return a.det||''; }
  return '';
}
function phraseOf(st,ak,w,ov=null){
  const a=DATA[st][ak], it=findIt(a,w), core=w==='∅'?'':w;
  if(st==='fx'||st==='wd') return w;
  if(st==='wp'||st==='pv'||st==='vc') return [ak,core].filter(Boolean).join(' ');
  let d=detKey(st,a,it,ov); if(d==='a') d=art(ak);
  return [core,d,ak].filter(Boolean).join(' ');
}
function exampleOf(st,ak,it){

}
const ALL=[], HEADS=new Map(), HP=new Map();

  if(!h.ctx&&a.ctx) h.ctx=a.ctx;
  if(!h.ax&&a.ax) h.ax=a.ax;
  if(!h.gx&&a.gx) h.gx=a.gx;
  h.secs[st]=a; if(!h.pts.includes(a.pt)) h.pts.push(a.pt);
  if(rank(a.c)<rank(h.c)) h.c=a.c; if(h.d!==a.d) h.d='amb';
  a.items.forEach(it=>{
    const p={id:st+'|'+ak+'|'+it.w,st,ak,a,it,ph:phraseOf(st,ak,it.w),lvl:it.c||a.c,dom:it.x||a.d,doms:[it.x||a.d,...(it.dm||[])]};
    p.key=norm([p.ph,a.pt,it.g||'',ak].join(' '));

  });
}

let AUD=Object.assign({acc:'us',rate:'n',auto:false},store.get('colocacoes.audio.v1',{}));

const hasTTS='speechSynthesis' in window;
function loadVoices(){ if(hasTTS) VOICES=speechSynthesis.getVoices()||[]; }
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){
  const want=AUD.acc==='uk'?'en-GB':'en-US', en=VOICES.filter(v=>/^en/i.test(v.lang)), norm=v=>v.lang.replace('_','-');
  return en.find(v=>norm(v)===want&&/google|natural|premium|enhanced|neural/i.test(v.name))||en.find(v=>norm(v)===want)||en.find(v=>/^en/i.test(v.lang))||null;
}
function utter(t){
  const u=new SpeechSynthesisUtterance(t), v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang;} else u.lang=AUD.acc==='uk'?'en-GB':'en-US';

function speak(t){
  if(!t) return;

}

/* Mapa PRIVADO de correspondência com os livros: importado pelo usuário, guardado só no aparelho (localStorage).

let BOOKMAP=store.get('colocacoes.mapa.v1',null);
const LEVEL_BOOK={B1:'B1',B2:'B2',C:'C'};
const bookUnitInfo=(book,n)=>{const b=BOOKMAP&&BOOKMAP.livros&&BOOKMAP.livros[book];return b?b.unidades.find(x=>x.n===n)||null:null;};
function bookRefs(u){
  if(!BOOKMAP) return null;
  const book=LEVEL_BOOK[u.L]; if(!book||!BOOKMAP.livros[book]) return null;
  const sc=new Map(), add=(n,k,v=1)=>{const o=sc.get(n)||{n,ev:0,tv:0,hd:0,tp:0};o[k]+=v;sc.set(n,o);};
  u.ps.forEach(p=>{((BOOKMAP.pares||{})[p.id]||[]).forEach(([b,n])=>{if(b===book) add(n,'ev');});});
  new Set(u.ps.map(p=>p.ak)).forEach(ak=>{((BOOKMAP.palavras||{})[ak]||[]).forEach(([b,n,w])=>{if(b===book) add(n,w===9?'tv':'hd');});});
  (((BOOKMAP.temas||{})[book]||{})[u.tema]||[]).forEach(n=>add(n,'tp'));
  return [...sc.values()].map(o=>({...o,score:o.ev*3+o.tv*4+o.hd+o.tp*4})).sort((a,b)=>b.score-a.score).slice(0,3)
    .map(r=>({...r,info:bookUnitInfo(book,r.n),book})).filter(r=>r.info);
}
const refTag=r=>r.tv&&r.ev?`${r.tv} palavras do vocabulário + ${r.ev} colocações`:r.tv?`${r.tv} palavra${r.tv>1?'s':''} do vocabulário da unidade`:r.ev?`${r.ev} colocaç${r.ev===1?'ão':'ões'} no texto`:'tema afim';

const dayKey=(d=new Date())=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10);};
function streak(){let n=0;const d=new Date();if(!act[dayKey(d)]) d.setDate(d.getDate()-1);while(act[dayKey(d)]&&act[dayKey(d)].n>0){n++;d.setDate(d.getDate()-1);}return n;}
function overallAcc(){let n=0,c=0;Object.values(prog).forEach(r=>{n+=r.n||0;c+=r.c||0;});return n?Math.round(100*c/n):null;}

let UCACHE={key:'',nodes:[]};
const PAT_LABEL={1:'verbo + -ing',2:'verbo + to + verbo',3:'verbo + objeto + to',4:'verbo + that',5:'o sentido muda',6:'preposições fixas'};
function patGroup(p){
  if(p.st!=='vc') return 6;
  const w=new Set(p.a.items.filter(i=>i.s===3).map(i=>i.w));
  const ing=w.has('doing')||w.has('in doing'), to=w.has('to do')||w.has('to be')||w.has('do')||w.has('of sb to do');
  const sb=[...w].some(x=>/^sb |^sth |^yourself /.test(x)), th=w.has('that');
  if(ing&&to) return 5;
  if(sb) return 3; if(ing) return 1; if(to) return 2; if(th) return 4;
  return 2;
}
function patBuckets(b){
  const g=new Map(); b.ps.forEach(p=>{const k=patGroup(p); if(!g.has(k)) g.set(k,[]); g.get(k).push(p);});
  const keys=[...g.keys()].sort(), out=[]; let carry=[];
  keys.forEach((k,i)=>{const ps=[...carry,...g.get(k)]; carry=[]; if(ps.length<8&&i<keys.length-1){carry=ps;return;} out.push({t:b.t,sub:PAT_LABEL[k],ps});});
  if(carry.length){ if(out.length) out[out.length-1].ps.push(...carry); else out.push({t:b.t,sub:PAT_LABEL[6],ps:carry}); }
  return out;
}
function sortPairs(ps){const o={vn:0,an:1,adv:2,pn:3,wp:4,pv:5,fx:6,vc:7,wd:8};return [...ps].sort((x,y)=>x.ak.toLowerCase().localeCompare(y.ak.toLowerCase())||o[x.st]-o[y.st]);}
function unitNodes(){
  if(UCACHE.key===S.track) return UCACHE.nodes;
  const nodes=[];
  ['A','B1','B2','C'].forEach(L=>{
    let n=0;
    const pool=strongPool().filter(p=>pLv(p)===L&&trackOk(p));
    if(!pool.length) return;
    const byT=new Map();
    pool.forEach(p=>{const hh=HEADS.get(p.ak), t=themeOf(hh)||'Diversos'; if(!byT.has(t)) byT.set(t,[]); byT.get(t).push(p);});
    const order=[...new Set([...(S.track==='neg'?CTX_ORDER:S.track==='acd'?ACX_ORDER:S.track==='gre'?GX_ORDER:[]),...THEME_ORDER,...byT.keys()])];
    let buckets=order.filter(t=>byT.has(t)).map(t=>({t,ps:byT.get(t)}));
    const small=buckets.filter(b=>b.ps.length<10); buckets=buckets.filter(b=>b.ps.length>=10);
    if(small.length){const ps=small.flatMap(b=>b.ps); if(ps.length>=6||!buckets.length) buckets.push({t:'Diversos',ps}); else buckets[buckets.length-1].ps.push(...ps);}
    buckets=buckets.flatMap(b=>(b.t==='Padrões verbais'&&b.ps.length>=14)?patBuckets(b):[b]);
    const units=[];
    buckets.forEach(b=>{const ps=sortPairs(b.ps),parts=Math.ceil(ps.length/28),size=Math.ceil(ps.length/parts);
      for(let i=0;i<parts;i++) units.push({tema:b.t,sub:b.sub,part:i+1,parts,ps:ps.slice(i*size,(i+1)*size)});});
    units.forEach((u,i)=>{
      n++; Object.assign(u,{type:'unit',n,L,id:`${L}-${n}`}); nodes.push(u);
      if((i+1)%4===0&&i+1<units.length){const grp=units.slice(i-3,i+1); nodes.push({type:'rev',L,id:`R${L}-${n}`,ps:grp.flatMap(x=>x.ps),from:grp[0].n,to:u.n});}
    });
    nodes.push({type:'test',L,id:'T'+L,ps:units.flatMap(x=>x.ps)});
  });
  UCACHE={key:S.track,nodes}; return nodes;
}
const unitWords=u=>{const ks=[...new Set(u.ps.map(p=>p.ak))];return ks.slice(0,4).join(' · ')+(ks.length>4?` +${ks.length-4}`:'');};
const uName=u=>u.sub?`${u.tema} · ${u.sub}`:u.tema;
const unitLabel=u=>`${LVNAME[u.L][0]} · U${String(u.n).padStart(2,'0')} · ${uName(u)}${u.parts>1?` (${u.part}/${u.parts})`:''}`;
const unitTitle=u=>`U${String(u.n).padStart(2,'0')} · ${uName(u)}${u.parts>1?` (${u.part}/${u.parts})`:''}`;
function unitCat(u){if(u.tema==='Padrões verbais') return 'PADRÕES';const c={};u.ps.forEach(p=>{c[CAT[p.st]]=(c[CAT[p.st]]||0)+1;});const [k,v]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return v/u.ps.length>0.5?k:'MISTA';}
function unitStats(u){
  let m=0,s=0,n=0,c=0;
  u.ps.forEach(p=>{const r=prog[p.id]; if(!r) return; if(r.b>=4) m++; else s++; n+=r.n||0; c+=r.c||0;});
  const total=u.ps.length, seen=m+s;
  return {total,m,s,seen,acc:n?Math.round(100*c/n):null,n,done:total>0&&seen/total>=0.8};
}

}

function levelAgg(L){
  const us=unitNodes().filter(n=>n.L===L&&n.type==='unit');
  let total=0,m=0,s=0,done=0; us.forEach(u=>{const st=unitStats(u);total+=st.total;m+=st.m;s+=st.s;if(st.done) done++;});
  return {us,total,m,s,done};
}
function nodeRows(L){
  let out='';
  unitNodes().filter(n=>n.L===L).forEach(u=>{
    if(u.type==='unit'){const st=unitStats(u);
      out+=`<button class="unit${st.done?' done':''}" data-unit="${u.id}"><span class="un">${String(u.n).padStart(2,'0')}</span><span class="ub"><span class="ut">${esc(uName(u))}${u.parts>1?` (${u.part}/${u.parts})`:''} <span class="tag">${unitCat(u)}</span>${st.done?' <span class="tag lv">✓</span>':''}</span><span class="us" lang="en">${esc(unitWords(u))}</span><span class="us">${st.total} colocações${st.acc!==null?` · ${st.acc}% de acerto`:''}</span><span class="mini"><i style="width:${Math.round(100*st.seen/st.total)}%"></i></span></span></button>`;}
    else if(u.type==='rev') out+=`<button class="unit rev" data-sess="rev" data-arg="${u.id}"><span class="un">↻</span><span class="ub"><span class="ut">Revisão <span class="tag">U${String(u.from).padStart(2,'0')}–U${String(u.to).padStart(2,'0')}</span></span><span class="us">15 questões misturando as últimas 4 unidades</span></span></button>`;
    else{const t=tests[u.L];out+=`<button class="unit test" data-sess="test" data-arg="${u.L}"><span class="un">★</span><span class="ub"><span class="ut">Teste de progresso <span class="tag">${LVNAME[u.L][0]}</span></span><span class="us">20 questões · aprovação com 80%${t?` · melhor: ${t.best}%`:''}</span></span></button>`;}
  });
  return out;
}

function headVisible(h){
  if(S.tema!=='all'&&themeOf(h)!==S.tema) return false;
  const q=norm(S.q.trim());
  const ps=HP.get(h.key).filter(p=>(S.gs==='all'||p.st===S.gs)&&pairPasses(p));
  const base=S.gtrap?ps.some(p=>p.it.s===0):ps.some(p=>p.it.s===3);
  if(!base) return false;
  if(!q) return true;
  return norm(h.key+' '+h.pt).includes(q)||ps.some(p=>p.key.includes(q));
}
function headBody(h){
  const ps=HP.get(h.key);
  let out='';
  for(const st of ORDER){
    const a=h.secs[st]; if(!a) continue;
    if(S.gs!=='all'&&S.gs!==st) continue;
    let rows=ps.filter(p=>p.st===st);
    if(S.gtrap) rows=rows.filter(p=>p.it.s===0||p.it.s===2);
    rows.sort((x,y)=>(y.it.s||0)-(x.it.s||0));
    if(!rows.length) continue;
    out+=`<h4 style="--hc:${STRUCT[st].hc}">${STRUCT[st].name}${a.pt!==h.pts[0]?` · <span class="muted">${esc(a.pt)}</span>`:''}</h4>`;
    if(a.n) out+=`<p class="snote">${esc(a.n)}</p>`;
    out+=rows.map(p=>{
      const s=p.it.s, fix=p.it.f&&findIt(a,p.it.f);
      const sub=s===3?p.it.g:(fix?`${p.it.t} → ${phraseOf(st,h.key,fix.w)}`:p.it.t);
      const tg=(p.it.r?`<span class="tag">${esc(p.it.r)}</span> `:'')+(p.it.sep?'<span class="tag">separável</span> ':'')+(p.it.insep?'<span class="tag">inseparável</span> ':'');
      return `<div class="prow${pairPasses(p)?'':' dim'}" data-s="${s}"><button class="main" data-pair="${esc(p.id)}" aria-label="Abrir ${esc(p.ph)} no laboratório"><span class="g" aria-hidden="true">${GL[s]}</span><span><span class="pph" lang="en">${esc(p.ph)}</span><span class="pgl">${tg}${esc(sub)}</span></span></button>${s===3?`<button class="sp" data-say="${esc(p.ph)}" aria-label="Ouvir ${esc(p.ph)}">🔊</button>`:(fix?`<button class="sp" data-say="${esc(phraseOf(st,h.key,fix.w))}" aria-label="Ouvir a forma correta">🔊</button>`:'')}</div>`;
    }).join('');
  }
  const bk=BOOKMAP&&BOOKMAP.palavras&&BOOKMAP.palavras[h.key];
  const bkl=bk?`<p class="bookline">📖 ${bk.map(([b,n])=>{const i=bookUnitInfo(b,n);return i?`${esc(BOOKMAP.livros[b].nome)} · Unit ${n} · ${esc(i.titulo)} (p. ${i.pag})`:'';}).filter(Boolean).join(' · ')}</p>`:'';
  return `<div class="hbody">${out}${bkl}<div class="hfoot"><button class="btn alt" data-lab="${esc(h.key)}">Abrir no laboratório</button><button class="btn" data-drill="${esc(h.key)}">Praticar</button></div></div>`;
}

const availStructs=k=>ORDER.filter(st=>HEADS.get(k).secs[st]);
function labSet(head,st,partner){
  const h=HEADS.get(head); if(!h) return;
  S.head=head; S.struct=(st&&h.secs[st])?st:(h.secs[S.struct]?S.struct:availStructs(head)[0]);
  const a=h.secs[S.struct];
  S.partner=partner||(a.items.find(i=>i.s===3)).w; S.det=null;
}
function statusOf(){
  const a=DATA[S.struct][S.head], it=findIt(a,S.partner);
  return {a,it,key:it?it.s:'n'};
}
function renderLab(){
  const {a,it,key}=statusOf(), ST=STRUCT[S.struct], R=rolesOf(S.struct,a), h=HEADS.get(S.head);
  const d=detKey(S.struct,a,it,S.det), dShown=d==='a'?art(S.head):d;
  const none=S.partner==='∅';
  const parts={
    p:`<button class="brick ${R.p[1]}${none?' empty':''}" data-jump="lp" aria-label="${R.p[0]}: ${none?'nenhuma':esc(S.partner)}"><span class="role">${R.p[0]}</span><span class="w">${esc(S.partner)}</span></button>`,
    d:(S.struct==='vn'||(S.struct==='pn'&&dShown))?`<button class="brick det${dShown?'':' empty'}" data-jump="${S.struct==='vn'?'lr':'lp'}" aria-label="artigo: ${dShown||'sem artigo'}"><span class="role">${S.struct==='pn'&&/^(my|your|his|her|our|their)$/.test(dShown)?'possessivo':'artigo'}</span><span class="w">${dShown||'∅'}</span></button>`:'',
    a:`<button class="brick ${R.a[1]}" data-act="pick" aria-label="${R.a[0]}: ${esc(S.head)}. Trocar palavra"><span class="role">${R.a[0]}</span><span class="w">${esc(S.head)}</span></button>`
  };
  const fix=it&&it.f?findIt(a,it.f):null;
  let gl;
  if(key===3) gl=esc(it.g);
  else if(fix) gl=`Prefira <b>${esc(phraseOf(S.struct,S.head,fix.w,S.det))}</b>`;
  else if(key===2) gl='Uso fraco';
  else gl='Fora do banco atual';
  const ph=phraseOf(S.struct,S.head,S.partner,S.det);

  const groups=[[3,'Naturais'],[2,'Fracas'],[0,'Evite']];
  const lists=groups.map(([s,l])=>{
    const xs=a.items.filter(i=>i.s===s); if(!xs.length) return '';
    return `<div class="lgroup" data-s="${s}"><h3><span class="g" aria-hidden="true" style="width:20px;height:20px;font-size:11px">${GL[s]}</span>${l}</h3><div class="list">${xs.map(i=>
      `<div class="lwrap${i.w===S.partner?' sel':''}" data-s="${s}"><button class="lrow" data-s="${s}" data-partner="${esc(i.w)}" aria-pressed="${i.w===S.partner}"><span class="t"><span class="w" lang="en">${esc(i.w)}</span><span class="gl">${i.r?`<span class="tag">${esc(i.r)}</span> `:''}${esc(s===3?i.g:i.t)}</span></span>${i.c?`<span class="tag lv">${i.c}</span>`:''}</button>`+`${s===3?`<button class="sp" data-say="${esc(phraseOf(S.struct,S.head,i.w,S.det))}" aria-label="Ouvir">🔊</button>`:''}</div>`).join('')}</div></div>`;
  }).join('');

  const strong=a.items.filter(i=>i.s===3&&i.w!==S.partner);
  const txt=key===3?'Combinação atestada e frequente.':key==='n'?'Fora do banco atual: pode ser rara ou incorreta. O motor não afirma erro sem evidência.':it.t;
  const sugList=fix?[fix]:strong.slice(0,4);
  const sg=key===3?'':`<p class="hint" style="margin:12px 0 6px">${fix?'Mais natural:':`Mais naturais com ${esc(S.head)}:`}</p><div class="chips">${sugList.map(i=>`<button class="chip" data-partner="${esc(i.w)}">${esc(phraseOf(S.struct,S.head,i.w,S.det))}</button>`).join('')}</div>`;
  let extra='';
  if(S.struct==='vn'){
    const dd=detKey(S.struct,a,it,S.det);

  let exh='';
  if(exs){let hh=esc(exs); if(S.struct==='an'||S.struct==='adv') hh=hh.replace(esc(it.w),`<mark>${esc(it.w)}</mark>`);
    exh=`<div class="exbox"><p lang="en">${hh}</p><button class="ib" data-say="${esc(exs)}" aria-label="Ouvir o exemplo">🔊</button></div>`;}
  const av=availStructs(S.head);

  $('#tab-lab').innerHTML=`

function clozeOf(p,bad){
  const ex=exampleOf(p.st,p.ak,p.it); if(!ex||p.st==='vn'||p.st==='fx'||p.st==='vc'||p.st==='wd') return null;
  const w=p.it.w; if(w==='∅') return null;
  const re=new RegExp('(^|[^A-Za-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','i');

  else dist=(bad||[]).filter(b=>b.w!=='∅'&&b.w!==w).map(b=>({w:b.w,s:b.s,t:b.t}));
  if(!dist.length) return null;
  const idx=m.index+m[1].length;
  return {kind:'cloze',sentence:ex.slice(0,idx)+'_____'+ex.slice(idx+w.length),answer:w,
    opts:shuffle([{t:w,ok:1},...dist.map(d=>({t:d.w,ok:0,s:d.s,note:d.t}))])};
}

function wdDistractors(p,n){
  /* alternativas erradas: mesma trilha, mesma classe, OUTRO campo de sentido e SEM palavras em comum na tradução (evita sinônimos) */
  const cl=clusterOf(p.ak), tr=q=>q.doms.some(d=>p.doms.includes(d)), mine=glTok(p.it.g);
  const safe=q=>{for(const t of glTok(q.it.g)) if(mine.has(t)) return false; return true;};
  const strict=WDPOOL.filter(q=>q.ak!==p.ak&&tr(q)&&q.a.pos===p.a.pos&&clusterOf(q.ak)!==cl&&safe(q));
  const loose=WDPOOL.filter(q=>q.ak!==p.ak&&tr(q)&&clusterOf(q.ak)!==cl&&safe(q));
  const base=strict.length>=n*3?strict:loose;
  return shuffle(base).slice(0,n);
}
function wdCloze(p,ds){
  const ex=p.it.ex, w=p.it.w; if(!ex||ds.length<2) return null;
  const re=new RegExp('(^|[^A-Za-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','i');
  const m=ex.match(re); if(!m) return null;
  const idx=m.index+m[1].length;
  return {kind:'cloze',sentence:ex.slice(0,idx)+'_____'+ex.slice(idx+w.length),answer:w,
    opts:shuffle([{t:w,ok:1},...ds.map(d=>({t:d.it.w,ok:0,s:3,note:`${d.it.w} = ${d.it.g}`}))])};
}

    const cz=wdCloze(p,ds); if(cz&&Math.random()<0.5) return {...b0,...cz};

  const bad=shuffle(a.items.filter(i=>i.s===0)).concat(shuffle(a.items.filter(i=>i.s===2))).slice(0,2);
  const base={id:p.id,st:p.st,prompt:p.it.g,ph:p.ph,ex:exampleOf(p.st,p.ak,p.it),note:a.n||'',lvl:p.lvl};

  else if(mode==='unit'||mode==='cards'){const u=node(o.arg); if(!u) return null; pool=u.ps; n=mode==='cards'?15:12; qmode=mode==='cards'?'card':'mix'; title=unitLabel(u)+(mode==='cards'?' · flashcards':''); back={tab:'units',unit:u.id,level:u.L};}
  else if(mode==='rev'){const u=node(o.arg); if(!u) return null; pool=u.ps; n=15; title=`Revisão ${LVNAME[u.L][0]} · U${String(u.from).padStart(2,'0')}–U${String(u.to).padStart(2,'0')}`; back={tab:'units',level:u.L};}
  else if(mode==='test'&&o.arg==='G'){pool=strongPool().filter(p=>p.doms.includes('gre')); n=30; qmode='test'; title='Simulado · GRE'; back={tab:'prac'};}
  else if(mode==='test'&&o.arg==='E'){pool=strongPool().filter(p=>p.doms.includes('acd')); n=30; qmode='test'; title='Simulado · TOEFL'; back={tab:'prac'};}
  else if(mode==='test'&&o.arg==='N'){pool=strongPool().filter(p=>p.dom==='neg'||!!HEADS.get(p.ak).ctx); n=30; qmode='test'; title='Simulado · Negócios'; back={tab:'prac'};}

    const fresh=shuffle(pool.filter(p=>!prog[p.id])).sort((x,y)=>rank(x.lvl)-rank(y.lvl));

    pick=shuffle(pool).sort((x,y)=>((prog[x.id]?prog[x.id].b:-1)-(prog[y.id]?prog[y.id].b:-1))).slice(0,n);

      <div class="optrow">${q.opts.map((o,n)=>`<button class="opt${ans===null?'':o.ok?' ok':(n===ans?' no':'')}" data-opt="${n}" ${ans!==null?'disabled':''} lang="en">${esc(o.t)}</button>`).join('')}</div>
      ${ans===null?'':fbBlock(q,ans)}`;

    el.innerHTML=head+`<p class="qprompt">${promptWord} <b>“${esc(q.prompt)}”</b>?</p><p class="qhelp">Pense na resposta e toque para conferir.</p>

        <div class="two"><button class="btn alt" data-act="card-no">Errei</button><button class="btn" data-act="card-ok">Acertei</button></div>`
       :`<button class="btn block" data-act="flip" style="margin-top:8px">Mostrar resposta</button>`}`;
  }
}
function fbBlock(q,ans){
  const Q=S.prac, o=q.opts[ans], good=o.ok, right=q.opts.find(x=>x.ok).t;
  return `<div class="fb" data-s="${good?3:0}"><strong>${good?'Certo.':'Quase.'}</strong> ${good?esc(q.ex||'Combinação natural.'):esc(o.note||'')}${good?'':` <b lang="en">Natural: ${esc(q.kind==='cloze'?right:right)}.</b>`}${q.note?`<p class="hint" style="margin-top:6px">${esc(q.note)}</p>`:''}
    <div class="fbrow"><button class="ib" data-say="${esc(q.kind==='cloze'?q.sentence.replace('_____',right):right)}" aria-label="Ouvir a resposta correta">🔊 Resposta</button>${(q.kind!=='cloze'&&q.ex)?`<button class="ib" data-say="${esc(q.ex)}" aria-label="Ouvir o exemplo">🔊 Exemplo</button>`:''}</div></div>
    <button class="btn block" data-act="next" style="margin-top:14px">${Q.i+1>=Q.qs.length?'Ver resultado':'Próxima'}</button>`;
}
function pracAnswer(n){
  const Q=S.prac,q=Q.qs[Q.i]; if(Q.picked!==null) return;
  Q.picked=n; const o=q.opts[n], right=q.opts.find(x=>x.ok).t;
  record(q.id,!!o.ok); if(o.ok) Q.score++;
  if(AUD.auto) speakMany([q.kind==='cloze'?q.sentence.replace('_____',right):right,q.kind==='cloze'?'':q.ex]);
  else Q.missed.push(q.kind==='cloze'?{wrong:q.sentence.replace('_____',o.t),right:q.sentence.replace('_____',right),note:o.note||q.prompt}:{wrong:o.t,right,note:o.note||''});
  renderPrac();
}
function pracCard(ok){
  const Q=S.prac,q=Q.qs[Q.i]; record(q.id,ok);
  if(ok) Q.score++; else Q.missed.push({wrong:'',right:q.ph,note:q.prompt});
  Q.i++;Q.picked=null;Q.flip=false;renderPrac();window.scrollTo({top:0});
}
function startSession(mode,arg,head){
  const s=buildSession(mode,{arg:arg,head:head||arg});
  if(!s){toast('Nada para praticar aqui');return;}
  S.prac=s; setTab('prac');
}
function exitSession(){
  const b=S.prac&&S.prac.back; S.prac=null;
  if(b&&b.tab==='units'){S.unit=b.unit||null;if(b.level) S.ulevel=b.level;setTab('units');}
  else if(b&&b.tab&&b.tab!=='prac'){setTab(b.tab);}
  else {renderPrac();window.scrollTo({top:0});}
}

function pickerBody(){
  const q=norm(S.pq.trim());

document.addEventListener('click',e=>{

  else if(D.track!==undefined) setFilter('track',D.track);
  else if(D.gs){S.gs=D.gs;renderGloss();}
  else if(D.gtrap){S.gtrap=!S.gtrap;renderGloss();}
  else if(D.tema!==undefined){S.tema=D.tema;renderGloss();}
  else if(D.temaGo!==undefined){S.tema=D.temaGo;S.q='';setTab('gloss');}
  else if(D.more){S.more=!S.more;renderGloss();}
  else if(D.toggle){S.open[D.toggle]=!S.open[D.toggle];renderGloss();}
  else if(D.letter){const el=document.getElementById('L-'+D.letter); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(D.pair){const p=ALL.find(x=>x.id===D.pair); labSet(p.ak,p.st,p.it.w); setTab('lab');}
  else if(D.lab!==undefined){ if(!$('#sheet').hidden) closeSheet(); labSet(D.lab); setTab('lab'); }
  else if(D.drill!==undefined) startSession('head',D.drill,D.drill);
  else if(D.sess) startSession(D.sess,D.arg||undefined,D.h||undefined);
  else if(D.unit){S.unit=D.unit;S.ulevel=D.unit.split('-')[0];S.utab='ref';setTab('units');}
  else if(D.ulevel){S.ulevel=D.ulevel;S.unit=null;renderUnits();window.scrollTo({top:0});}
  else if(D.utab){S.utab=D.utab;renderUnits();}
  else if(D.eq){S.eq=D.eq;S.eqO=null;renderPrac();window.scrollTo({top:0});}
  else if(D.eqopt!==undefined) eqToggle(+D.eqopt);
  else if(D.esc){S.esc=D.esc;S.escOpts=null;renderPrac();window.scrollTo({top:0});}
  else if(D.eopt!==undefined) escAnswer(+D.eopt);
  else if(D.pt){S.pt=D.pt;renderPrac();}
  else if(D.start){ startSession(D.start); }
  else if(D.gloss!==undefined){
    if(D.gloss==='trap'){S.gtrap=true;S.gs='all';S.lvl='all';}
    else if(D.gloss==='head'){S.q=S.head;S.open[S.head]=true;S.gtrap=false;}
    else {S.lvl=D.gloss;S.gtrap=false;store.set('colocacoes.lvl',D.gloss);}
    setTab('gloss');
    if(D.gloss==='head') setTimeout(()=>{const el=document.getElementById('L-'+S.head[0].toUpperCase());if(el)el.scrollIntoView();},0);
  }
  else if(D.struct){S.struct=D.struct;const a=DATA[S.struct][S.head];S.partner=a.items.find(i=>i.s===3).w;S.det=null;renderLab();}
  else if(D.partner){S.partner=D.partner;renderLab();}
  else if(D.det!==undefined){S.det=D.det==='auto'?null:D.det==='none'?'':D.det;renderLab();}
  else if(D.jump){const el=document.getElementById(D.jump);if(el){if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}}
  else if(D.say!==undefined) speak(D.say);
  else if(D.opt!==undefined) pracAnswer(+D.opt);
  else if(D.act==='copy'){const {it}=statusOf();copy(phraseOf(S.struct,S.head,S.partner,S.det)+(it&&it.g?' — '+it.g:''));}
  else if(D.act==='pick') openPicker();

  else if(D.act==='mapdel'){BOOKMAP=null;try{localStorage.removeItem('colocacoes.mapa.v1');}catch(_){}toast('Mapa removido');openGuide();render();}

  else if(D.act==='flip'){S.prac.flip=true;renderPrac();if(AUD.auto){const q=S.prac.qs[S.prac.i];speakMany([q.ph,q.ex]);}}
  else if(D.act==='card-ok') pracCard(true);
  else if(D.act==='card-no') pracCard(false);
  else if(D.act==='exitprac') exitSession();
  else if(D.act==='eq-back'){S.eq=null;S.eqO=null;renderPrac();window.scrollTo({top:0});}
  else if(D.act==='eq-check') eqCheck();
  else if(D.act==='esc-back'){S.esc=null;S.escOpts=null;renderPrac();window.scrollTo({top:0});}
  else if(D.act==='esc-play'){const e=ESCUTA.find(x=>x.id===S.esc);if(e) playEsc(e,false);}
  else if(D.act==='esc-slow'){const e=ESCUTA.find(x=>x.id===S.esc);if(e) playEsc(e,true);}
  else if(D.act==='esc-tr'){if(S.escOpts){S.escOpts.tr=!S.escOpts.tr;renderPrac();}}
  else if(D.act==='units-back'){S.unit=null;renderUnits();window.scrollTo({top:0});}
  else if(D.act==='ulevel-back'){S.ulevel=null;S.unit=null;renderUnits();window.scrollTo({top:0});}
});
document.addEventListener('input',e=>{
  if(e.target.id==='qg'){S.q=e.target.value;const pos=e.target.selectionStart;renderGloss();const i=$('#qg');i.focus();i.setSelectionRange(pos,pos);}
  else if(e.target.id==='qp'){S.pq=e.target.value;pickerBody();}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='freeForm') return;
  e.preventDefault(); let v=$('#qf').value.trim().toLowerCase(); if(!v) return;
  if(S.struct==='wp'&&/^(0|nenhuma|sem|none|-)$/.test(v)) v='∅';
  S.partner=v; renderLab();
});
document.addEventListener('change',e=>{
  if(e.target.id!=='mapfile'||!e.target.files[0]) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const j=JSON.parse(fr.result);
      if(j.versao!==1||!j.livros||!j.pares||!j.temas) throw new Error('formato');
      BOOKMAP=j; store.set('colocacoes.mapa.v1',j); toast('Mapa importado'); openGuide(); render();
    }catch(err){toast('Arquivo inválido');}
  };
  fr.readAsText(e.target.files[0]);
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

function applyTheme(t){
  document.documentElement.dataset.theme=t; store.set('colocacoes.theme',t);
  $('#btnTheme').textContent=t==='dark'?'☀️':'🌙';
  document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0D131B':'#F2EEE4';
}
(function init(){
  const saved=store.get('colocacoes.theme',null);
  applyTheme(saved||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  const nA=HEADS.size, pairs=ALL.filter(p=>p.it.s===3).length, traps=ALL.filter(p=>p.it.s===0).length;
  $('#foot').textContent=`v2.4 · ${nA} palavras · ${pairs} colocações naturais · ${traps} armadilhas PT-BR`;
  labSet('decision','vn','make'); setTab('home');
  window.__boot=true;
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{try{r.update();}catch(e){}}).catch(()=>{});
})();
</script>
</body>
